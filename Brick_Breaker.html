<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Brick Breaker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-header {
            text-align: center;
            margin-bottom: 15px;
        }

        .game-header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .score-board {
            display: flex;
            gap: 30px;
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 5px;
        }

        .score-board span {
            color: #ff007f;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #1a233a;
            max-width: 95vw;
            width: 800px;
        }

        canvas {
            background: linear-gradient(180deg, #0a0b10 0%, #121624 100%);
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 800 / 500;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 11, 16, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .overlay h2 {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .overlay p {
            font-size: 1.1rem;
            color: #a0aabb;
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0d0e15;
            background: #00f0ff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            transform: translateY(-2px);
        }

        .controls-hint {
            margin-top: 15px;
            color: #606d80;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="game-header">
        <h1>NEON BREAKOUT</h1>
        <div class="score-board">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="startScreen" class="overlay">
            <h2>READY PLAYER ONE</h2>
            <p>Use Left/Right Arrows or Move Mouse to Control</p>
            <button class="btn" onclick="startGame()">START GAME</button>
        </div>

        <div id="gameOverScreen" class="overlay" style="display: none;">
            <h2 id="gameTitle" style="color: #ff007f;">GAME OVER</h2>
            <p id="finalScoreText">Your Final Score: 0</p>
            <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <div class="controls-hint">Controls: Move Mouse or Left / Right Arrow Keys</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const gameTitle = document.getElementById('gameTitle');
        const finalScoreText = document.getElementById('finalScoreText');

        // Game State Variables
        let score = 0;
        let lives = 3;
        let isGameRunning = false;
        let animationId;

        // Paddle Setup
        const paddle = {
            width: 100,
            height: 12,
            x: canvas.width / 2 - 50,
            y: canvas.height - 25,
            speed: 8,
            dx: 0
        };

        // Ball Setup
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 40,
            radius: 8,
            speed: 5,
            dx: 5,
            dy: -5
        };

        // Brick Grid Setup
        const brickRowCount = 5;
        const brickColumnCount = 9;
        const brickWidth = 72;
        const brickHeight = 20;
        const brickPadding = 12;
        const brickOffsetTop = 40;
        const brickOffsetLeft = 25;

        const brickColors = ['#ff007f', '#ff7700', '#ffea00', '#00f0ff', '#00ff66'];
        let bricks = [];

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1, color: brickColors[r] };
                }
            }
        }

        // Particle FX
        let particles = [];
        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    dx: (Math.random() - 0.5) * 4,
                    dy: (Math.random() - 0.5) * 4,
                    alpha: 1
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= 0.03;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        // Render Functions
        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
            ctx.fillStyle = '#00f0ff';
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        let brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        let brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        b.x = brickX;
                        b.y = brickY;
                        
                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 4);
                        ctx.fillStyle = b.color;
                        ctx.shadowColor = b.color;
                        ctx.shadowBlur = 6;
                        ctx.fill();
                        ctx.closePath();
                        ctx.shadowBlur = 0;
                    }
                }
            }
        }

        // Mechanics & Physics
        function collisionDetection() {
            let activeBricks = 0;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        activeBricks++;
                        if (
                            ball.x + ball.radius > b.x &&
                            ball.x - ball.radius < b.x + brickWidth &&
                            ball.y + ball.radius > b.y &&
                            ball.y - ball.radius < b.y + brickHeight
                        ) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            scoreEl.innerText = score;
                            createParticles(ball.x, ball.y, b.color);

                            // Increase ball speed slightly over time
                            ball.dx *= 1.01;
                            ball.dy *= 1.01;
                        }
                    }
                }
            }

            if (activeBricks === 0) {
                endGame(true);
            }
        }

        function movePaddle() {
            paddle.x += paddle.dx;

            if (paddle.x < 0) {
                paddle.x = 0;
            }
            if (paddle.x + paddle.width > canvas.width) {
                paddle.x = canvas.width - paddle.width;
            }
        }

        function moveBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall collisions (Left & Right)
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }

            // Wall collision (Top)
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }

            // Paddle collision
            if (
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width &&
                ball.y + ball.radius > paddle.y &&
                ball.y - ball.radius < paddle.y + paddle.height
            ) {
                // Calculate bounce angle based on hit location on paddle
                let collidePoint = ball.x - (paddle.x + paddle.width / 2);
                collidePoint = collidePoint / (paddle.width / 2);

                let angle = collidePoint * (Math.PI / 3);
                let currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                
                ball.dx = currentSpeed * Math.sin(angle);
                ball.dy = -currentSpeed * Math.cos(angle);
            }

            // Bottom Boundary (Life Loss)
            if (ball.y + ball.radius > canvas.height) {
                lives--;
                livesEl.innerText = lives;
                if (lives <= 0) {
                    endGame(false);
                } else {
                    resetBallAndPaddle();
                }
            }
        }

        function resetBallAndPaddle() {
            paddle.x = canvas.width / 2 - paddle.width / 2;
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 40;
            ball.dx = 5 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -5;
        }

        // Loop & Game Controls
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBricks();
            drawPaddle();
            drawBall();
            updateParticles();
            collisionDetection();

            movePaddle();
            moveBall();

            if (isGameRunning) {
                animationId = requestAnimationFrame(draw);
            }
        }

        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            score = 0;
            lives = 3;
            scoreEl.innerText = score;
            livesEl.innerText = lives;
            initBricks();
            resetBallAndPaddle();
            isGameRunning = true;
            draw();
        }

        function restartGame() {
            startGame();
        }

        function endGame(isWin) {
            isGameRunning = false;
            cancelAnimationFrame(animationId);
            
            if (isWin) {
                gameTitle.innerText = "YOU WIN!";
                gameTitle.style.color = "#00ff66";
            } else {
                gameTitle.innerText = "GAME OVER";
                gameTitle.style.color = "#ff007f";
            }
            
            finalScoreText.innerText = `Your Final Score: ${score}`;
            gameOverScreen.style.display = 'flex';
        }

        // Input Handlers
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight') {
                paddle.dx = paddle.speed;
            } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                paddle.dx = -paddle.speed;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'Left' || e.key === 'ArrowLeft') {
                paddle.dx = 0;
            }
        });

        function handlePointer(clientX) {
            const rect = canvas.getBoundingClientRect();
            if (rect.width > 0) {
                const mouseX = (clientX - rect.left) * (canvas.width / rect.width);
                if (mouseX >= 0 && mouseX <= canvas.width) {
                    paddle.x = mouseX - paddle.width / 2;
                }
            }
        }

        document.addEventListener('mousemove', (e) => {
            handlePointer(e.clientX);
        });

        document.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches[0]) {
                handlePointer(e.touches[0].clientX);
            }
        }, { passive: true });
    </script>
</body>
</html>
