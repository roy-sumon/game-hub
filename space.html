<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA STRIKE — Space Shooter</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:'Courier New',monospace;
    overflow:hidden;
    user-select:none;
}

#gameWrapper {
    position:relative;
    width:520px;
    height:720px;
    max-width: 96vw;
    max-height: 94vh;
}

@media (max-width: 540px), (max-height: 740px) {
    #gameWrapper {
        width: min(96vw, calc(94vh * 520 / 720));
        height: min(94vh, calc(96vw * 720 / 520));
    }
    #c {
        width: 100%;
        height: 100%;
    }
}

canvas {
    display:block;
    border:1px solid #0ff3;
    box-shadow:0 0 40px #0ff2, 0 0 80px #00f1;
}

/* ---- UI OVERLAYS ---- */
.overlay {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,10,0.92);
    z-index:10;
    gap:18px;
}

.overlay.hidden { display:none; }

.logo {
    font-size:52px;
    font-weight:900;
    letter-spacing:8px;
    color:#0ff;
    text-shadow:0 0 20px #0ff, 0 0 60px #0af;
    animation:pulse 2s ease-in-out infinite;
}

.logo span { color:#f0f; text-shadow:0 0 20px #f0f,0 0 60px #a0f; }

@keyframes pulse {
    0%,100%{filter:brightness(1)}
    50%{filter:brightness(1.4)}
}

.sub {
    font-size:13px;
    color:#0af;
    letter-spacing:4px;
    text-transform:uppercase;
}

.menu-btn {
    background:transparent;
    border:2px solid #0ff;
    color:#0ff;
    font-family:inherit;
    font-size:16px;
    letter-spacing:3px;
    padding:14px 48px;
    cursor:pointer;
    text-transform:uppercase;
    transition:all .2s;
    position:relative;
    overflow:hidden;
}

.menu-btn::before {
    content:'';
    position:absolute;
    inset:0;
    background:#0ff;
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .2s;
    z-index:-1;
}

.menu-btn:hover { color:#000; box-shadow:0 0 24px #0ff; }
.menu-btn:hover::before { transform:scaleX(1); }

.menu-btn.red { border-color:#f44; color:#f44; }
.menu-btn.red::before { background:#f44; }
.menu-btn.red:hover { color:#000; box-shadow:0 0 24px #f44; }

.controls-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px 32px;
    font-size:12px;
    color:#088;
    text-align:left;
}

.controls-grid span { color:#0cc; }

.stat-row {
    display:flex;
    gap:40px;
    font-size:13px;
    color:#0af;
}

.stat-row div { text-align:center; }
.stat-row .val {
    font-size:36px;
    font-weight:bold;
    color:#0ff;
    text-shadow:0 0 12px #0ff;
}

.grade {
    font-size:64px;
    font-weight:900;
    text-shadow:0 0 30px currentColor;
}

.grade.S { color:#ff0; }
.grade.A { color:#0ff; }
.grade.B { color:#0f0; }
.grade.C { color:#f80; }
.grade.D { color:#f44; }

/* HUD */
#hud {
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:10px 14px;
    pointer-events:none;
    z-index:5;
}

.hud-left, .hud-right { display:flex; flex-direction:column; gap:4px; }

.hud-label {
    font-size:10px;
    letter-spacing:2px;
    color:#055;
    text-transform:uppercase;
}

.hud-val {
    font-size:20px;
    font-weight:bold;
    color:#0ff;
    text-shadow:0 0 8px #0ff;
    letter-spacing:1px;
}

.hud-right { align-items:flex-end; }

/* Lives */
#livesDisplay {
    display:flex;
    gap:6px;
    align-items:center;
}

.life-icon {
    width:18px; height:18px;
    background:#f44;
    clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
    box-shadow:0 0 6px #f44;
    transition:all .3s;
}

.life-icon.empty {
    background:#333;
    box-shadow:none;
}

/* Boss HP */
#bossBar {
    position:absolute;
    bottom:60px; left:20px; right:20px;
    display:none;
    z-index:5;
    pointer-events:none;
}

#bossLabel {
    font-size:11px;
    letter-spacing:3px;
    color:#f44;
    text-align:center;
    margin-bottom:4px;
    text-shadow:0 0 8px #f44;
}

#bossTrack {
    height:8px;
    background:#1a0000;
    border:1px solid #f443;
    border-radius:4px;
    overflow:hidden;
}

#bossFill {
    height:100%;
    background:linear-gradient(90deg,#f44,#f80);
    box-shadow:0 0 8px #f44;
    transition:width .15s;
    border-radius:4px;
}

/* Combo */
#comboDisplay {
    position:absolute;
    top:50px; left:50%;
    transform:translateX(-50%);
    font-size:11px;
    letter-spacing:3px;
    color:#ff0;
    text-shadow:0 0 10px #ff0;
    pointer-events:none;
    z-index:5;
    transition:opacity .3s;
    opacity:0;
    text-align:center;
}

/* Wave announce */
#waveAnnounce {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:32px;
    font-weight:bold;
    letter-spacing:6px;
    color:#0ff;
    text-shadow:0 0 20px #0ff;
    pointer-events:none;
    z-index:6;
    opacity:0;
    text-align:center;
}

/* Mobile controls */
#mobileControls {
    position:absolute;
    bottom:0; left:0; right:0;
    height:80px;
    display:none;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    z-index:5;
}

.mob-btn {
    width:64px; height:64px;
    border:2px solid #0ff5;
    border-radius:50%;
    background:rgba(0,255,255,0.05);
    color:#0ff;
    font-size:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    active:background:rgba(0,255,255,0.2);
}

@media (max-width:560px) {
    #gameWrapper { width:100vw; height:100vh; }
    canvas { width:100vw !important; height:100vh !important; }
    #mobileControls { display:flex; }
}

.powerup-legend {
    display:flex; gap:16px; flex-wrap:wrap;
    justify-content:center; font-size:11px;
}
.pu-item { display:flex; align-items:center; gap:6px; }
.pu-dot {
    width:12px; height:12px; border-radius:50%;
    flex-shrink:0;
}

.high-score-txt {
    font-size:12px; color:#880; letter-spacing:2px;
}
.high-score-val {
    font-size:22px; font-weight:bold; color:#ff0;
    text-shadow:0 0 10px #ff0;
}
</style>
</head>
<body>

<div id="gameWrapper">
<canvas id="c" width="520" height="720"></canvas>

<!-- HUD -->
<div id="hud">
    <div class="hud-left">
        <div class="hud-label">Score</div>
        <div class="hud-val" id="scoreDisp">0</div>
        <div class="hud-label" style="margin-top:6px">Wave</div>
        <div class="hud-val" id="waveDisp">1</div>
    </div>
    <div class="hud-right">
        <div class="hud-label">Lives</div>
        <div id="livesDisplay"></div>
        <div class="hud-label" style="margin-top:6px">Shield</div>
        <div class="hud-val" id="shieldDisp">■■■■■</div>
    </div>
</div>

<div id="comboDisplay"></div>
<div id="waveAnnounce"></div>

<!-- Boss HP bar -->
<div id="bossBar">
    <div id="bossLabel">⚠ BOSS APPROACHING ⚠</div>
    <div id="bossTrack"><div id="bossFill"></div></div>
</div>

<!-- SCREENS -->
<div class="overlay" id="menuScreen">
    <div class="logo">NOVA<span>STRIKE</span></div>
    <div class="sub">Galactic Defense System</div>
    <button class="menu-btn" onclick="startGame()">▶ Launch</button>
    <div class="controls-grid">
        <div>← → or A D</div><div><span>Move</span></div>
        <div>Space / Click</div><div><span>Shoot</span></div>
        <div>Z / Shift</div><div><span>Special Bomb</span></div>
        <div>P</div><div><span>Pause</span></div>
    </div>
    <div class="powerup-legend">
        <div class="pu-item"><div class="pu-dot" style="background:#0ff"></div>Rapid Fire</div>
        <div class="pu-item"><div class="pu-dot" style="background:#f0f"></div>Triple Shot</div>
        <div class="pu-item"><div class="pu-dot" style="background:#ff0"></div>Shield</div>
        <div class="pu-item"><div class="pu-dot" style="background:#0f0"></div>Laser</div>
        <div class="pu-item"><div class="pu-dot" style="background:#f80"></div>Bomb+</div>
    </div>
    <div style="text-align:center">
        <div class="high-score-txt">Best Score</div>
        <div class="high-score-val" id="menuHigh">0</div>
    </div>
</div>

<div class="overlay hidden" id="pauseScreen">
    <div class="logo" style="font-size:36px">PAUSED</div>
    <button class="menu-btn" onclick="togglePause()">▶ Resume</button>
    <button class="menu-btn red" onclick="goMenu()">✕ Quit</button>
</div>

<div class="overlay hidden" id="gameOverScreen">
    <div class="logo" style="font-size:36px;letter-spacing:4px">GAME OVER</div>
    <div class="grade" id="gradeDisp">B</div>
    <div class="stat-row">
        <div><div class="val" id="finalScore">0</div><div>Score</div></div>
        <div><div class="val" id="finalWave">1</div><div>Wave</div></div>
        <div><div class="val" id="finalKills">0</div><div>Kills</div></div>
    </div>
    <div style="text-align:center">
        <div class="high-score-txt">High Score</div>
        <div class="high-score-val" id="highScoreDisp">0</div>
    </div>
    <button class="menu-btn" onclick="startGame()">↺ Play Again</button>
    <button class="menu-btn red" onclick="goMenu()">⌂ Menu</button>
</div>

<!-- Mobile Controls -->
<div id="mobileControls">
    <div style="display:flex;gap:8px">
        <div class="mob-btn" id="mbLeft">◀</div>
        <div class="mob-btn" id="mbRight">▶</div>
    </div>
    <div class="mob-btn" id="mbBomb">💣</div>
    <div class="mob-btn" id="mbFire" style="border-color:#f0f5;background:rgba(255,0,255,0.05)">🔥</div>
</div>

</div><!-- end wrapper -->

<script>
// ═══════════════════════════════════════════════════════
//  NOVA STRIKE — Full Space Shooter Engine
// ═══════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── STATE ──────────────────────────────────────────────
let G = {}; // game state
let keys = {};
let animId = null;
let lastTime = 0;
let highScore = +localStorage.getItem('novaStrikeHigh') || 0;

// ── INPUT ──────────────────────────────────────────────
document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyP' && G.running) togglePause();
    if ((e.code === 'KeyZ' || e.code === 'ShiftLeft') && G.running && !G.paused) useBomb();
    e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('click', () => { if (G.running && !G.paused) G.autoFire = true; });
canvas.addEventListener('mousedown', () => { if (G.running && !G.paused) G.mouseDown = true; });
canvas.addEventListener('mouseup', () => { G.mouseDown = false; });

// Mobile
document.getElementById('mbLeft').addEventListener('touchstart', e=>{ keys['ArrowLeft']=true; e.preventDefault(); },{passive:false});
document.getElementById('mbLeft').addEventListener('touchend', ()=>{ keys['ArrowLeft']=false; });
document.getElementById('mbRight').addEventListener('touchstart', e=>{ keys['ArrowRight']=true; e.preventDefault(); },{passive:false});
document.getElementById('mbRight').addEventListener('touchend', ()=>{ keys['ArrowRight']=false; });
document.getElementById('mbFire').addEventListener('touchstart', e=>{ G.mouseDown=true; e.preventDefault(); },{passive:false});
document.getElementById('mbFire').addEventListener('touchend', ()=>{ G.mouseDown=false; });
document.getElementById('mbBomb').addEventListener('touchstart', e=>{ useBomb(); e.preventDefault(); },{passive:false});

// ── UTILS ─────────────────────────────────────────────
const rnd = (a,b) => Math.random()*(b-a)+a;
const rndInt = (a,b) => Math.floor(rnd(a,b+1));
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
const lerp = (a,b,t) => a+(b-a)*t;

// ── INIT ──────────────────────────────────────────────
function startGame() {
    document.getElementById('menuScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('pauseScreen').classList.add('hidden');

    G = {
        running: true,
        paused: false,
        score: 0,
        wave: 1,
        kills: 0,
        lives: 3,
        shield: 5,
        maxShield: 5,
        bombs: 3,
        mouseDown: false,
        autoFire: false,

        // Timing
        shootCooldown: 0,
        shootRate: 180,        // ms between shots
        waveTimer: 0,
        waveDelay: 3000,
        waveSpawned: false,
        bossAlive: false,
        invincible: 0,

        // Power-up state
        pu: {
            rapid: 0,
            triple: 0,
            laser: 0,
        },

        // Collections
        player: null,
        bullets: [],
        enemyBullets: [],
        enemies: [],
        particles: [],
        powerups: [],
        stars: [],
        explosions: [],
        laserBeam: null,
        combo: 0,
        comboTimer: 0,
        shieldRegen: 0,
    };

    G.player = {
        x: W/2, y: H - 100,
        w: 36, h: 36,
        speed: 280,
        thrustAnim: 0,
    };

    // Stars
    for (let i = 0; i < 120; i++) {
        G.stars.push({
            x: rnd(0,W), y: rnd(0,H),
            r: rnd(0.3,2),
            speed: rnd(20,120),
            bright: rnd(0.2,1),
        });
    }

    updateHUD();
    announceWave();
    cancelAnimationFrame(animId);
    lastTime = performance.now();
    loop(lastTime);
}

function goMenu() {
    G.running = false;
    cancelAnimationFrame(animId);
    document.getElementById('pauseScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('menuScreen').classList.remove('hidden');
    document.getElementById('menuHigh').textContent = highScore;
}

function togglePause() {
    G.paused = !G.paused;
    document.getElementById('pauseScreen').classList.toggle('hidden', !G.paused);
    if (!G.paused) { lastTime = performance.now(); loop(lastTime); }
}

function gameOver() {
    G.running = false;
    if (G.score > highScore) {
        highScore = G.score;
        localStorage.setItem('novaStrikeHigh', highScore);
    }

    let grade;
    if (G.score >= 15000) grade = 'S';
    else if (G.score >= 8000) grade = 'A';
    else if (G.score >= 4000) grade = 'B';
    else if (G.score >= 1500) grade = 'C';
    else grade = 'D';

    const gd = document.getElementById('gradeDisp');
    gd.textContent = grade;
    gd.className = 'grade ' + grade;

    document.getElementById('finalScore').textContent = G.score;
    document.getElementById('finalWave').textContent = G.wave;
    document.getElementById('finalKills').textContent = G.kills;
    document.getElementById('highScoreDisp').textContent = highScore;
    document.getElementById('gameOverScreen').classList.remove('hidden');
}

// ── MAIN LOOP ──────────────────────────────────────────
function loop(ts) {
    if (!G.running || G.paused) return;
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    update(dt);
    render();
    updateHUD();

    animId = requestAnimationFrame(loop);
}

// ── UPDATE ─────────────────────────────────────────────
function update(dt) {
    const p = G.player;
    G.shootCooldown -= dt * 1000;
    G.invincible = Math.max(0, G.invincible - dt * 1000);

    // Player movement
    const spd = p.speed * (keys['ShiftLeft'] ? 0.55 : 1);
    if ((keys['ArrowLeft'] || keys['KeyA'])) p.x -= spd * dt;
    if ((keys['ArrowRight'] || keys['KeyD'])) p.x += spd * dt;
    if ((keys['ArrowUp'] || keys['KeyW'])) p.y -= spd * dt;
    if ((keys['ArrowDown'] || keys['KeyS'])) p.y += spd * dt;
    p.x = clamp(p.x, p.w/2, W - p.w/2);
    p.y = clamp(p.y, p.h/2, H - p.h/2);
    p.thrustAnim = (p.thrustAnim + dt * 12) % (Math.PI * 2);

    // Shooting
    const isShooting = keys['Space'] || G.mouseDown;
    if (isShooting && G.shootCooldown <= 0) {
        fire();
        const rate = G.pu.rapid > 0 ? 90 : G.pu.laser > 0 ? 60 : 180;
        G.shootCooldown = rate;
    }

    // Shield regen
    G.shieldRegen += dt;
    if (G.shieldRegen >= 4 && G.shield < G.maxShield) {
        G.shield++;
        G.shieldRegen = 0;
    }

    // Power-up timers
    for (const k in G.pu) { if (G.pu[k] > 0) G.pu[k] -= dt * 1000; }

    // Bullets
    G.bullets = G.bullets.filter(b => {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt * 1000;
        return b.y > -20 && b.y < H+20 && b.x > -20 && b.x < W+20 && b.life > 0;
    });

    // Enemy bullets
    G.enemyBullets = G.enemyBullets.filter(b => {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        return b.y < H+20 && b.x > -10 && b.x < W+10 && b.y > -10;
    });

    // Enemies
    updateEnemies(dt);

    // Power-ups
    G.powerups = G.powerups.filter(pu => {
        pu.y += 60 * dt;
        pu.bob = (pu.bob || 0) + dt * 3;
        return pu.y < H + 30;
    });

    // Particles
    G.particles = G.particles.filter(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        p.vx *= 0.97;
        p.vy *= 0.97;
        return p.life > 0;
    });

    // Stars
    G.stars.forEach(s => {
        s.y += s.speed * dt;
        if (s.y > H) { s.y = -2; s.x = rnd(0,W); }
    });

    // Combo decay
    if (G.combo > 0) {
        G.comboTimer -= dt * 1000;
        if (G.comboTimer <= 0) { G.combo = 0; hideCombo(); }
    }

    // Collisions
    checkCollisions();

    // Wave management
    updateWave(dt);
}

// ── FIRE ──────────────────────────────────────────────
function fire() {
    const p = G.player;
    if (G.pu.laser > 0) {
        G.laserBeam = { x: p.x, y: p.y, life: 80 };
        // Laser damage enemies directly
        G.enemies.forEach(e => {
            if (Math.abs(e.x - p.x) < 18 + e.size) {
                damageEnemy(e, 3);
            }
        });
        spawnParticles(p.x, p.y - 20, '#0f0', 3, 1);
    } else if (G.pu.triple > 0) {
        spawnBullet(p.x, p.y, 0, -700, '#f0f', 6);
        spawnBullet(p.x-14, p.y, -80, -680, '#f0f', 6);
        spawnBullet(p.x+14, p.y, 80, -680, '#f0f', 6);
    } else {
        spawnBullet(p.x, p.y, 0, -750, '#0ff', 8);
    }
}

function spawnBullet(x, y, vx, vy, color, r) {
    G.bullets.push({ x, y, vx, vy, color, r, life: 2000 });
}

function useBomb() {
    if (G.bombs <= 0) return;
    G.bombs--;
    // Screen flash + kill all non-boss enemies
    G.enemies.forEach(e => {
        if (!e.isBoss) {
            addScore(e.score);
            spawnExplosion(e.x, e.y, e.size, e.color);
            spawnPowerupMaybe(e.x, e.y);
            G.kills++;
        } else {
            damageEnemy(e, 20);
        }
    });
    G.enemies = G.enemies.filter(e => e.isBoss);
    G.enemyBullets = [];
    // Bomb flash particles
    for (let i = 0; i < 80; i++) {
        const angle = rnd(0, Math.PI*2);
        const spd = rnd(100,500);
        G.particles.push({
            x: rnd(0,W), y: rnd(0,H),
            vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
            color: ['#0ff','#f0f','#ff0','#fff'][rndInt(0,3)],
            r: rnd(2,6), life: rnd(0.3,0.9),
        });
    }
    updateHUD();
}

// ── ENEMIES ───────────────────────────────────────────
function updateEnemies(dt) {
    G.enemies = G.enemies.filter(e => {
        if (e.hp <= 0) return false;

        e.age = (e.age||0) + dt;
        e.shootTimer = (e.shootTimer||0) - dt*1000;
        e.movTimer = (e.movTimer||0) + dt;

        // Movement patterns
        switch(e.pattern) {
            case 'straight':
                e.y += e.speed * dt;
                e.x += e.dx * dt;
                break;
            case 'sine':
                e.y += e.speed * dt;
                e.x = e.originX + Math.sin(e.age * e.sineFreq) * e.sineAmp;
                break;
            case 'zigzag':
                e.y += e.speed * dt;
                if (e.x < 40 || e.x > W-40) e.dx *= -1;
                e.x += e.dx * dt;
                break;
            case 'dive':
                if (e.age < 1.2) { e.y += e.speed * 0.3 * dt; }
                else {
                    const ang = Math.atan2(G.player.y - e.y, G.player.x - e.x);
                    e.x += Math.cos(ang) * e.speed * dt;
                    e.y += Math.sin(ang) * e.speed * dt;
                }
                break;
            case 'orbit':
                e.angle = (e.angle||0) + e.orbitSpeed * dt;
                e.x = e.centerX + Math.cos(e.angle) * e.orbitR;
                e.y = e.centerY + Math.sin(e.angle) * e.orbitR;
                e.centerY += 30 * dt;
                break;
            case 'boss':
                bossBehavior(e, dt);
                break;
        }

        // Shooting
        if (e.shootTimer <= 0 && e.shootRate) {
            enemyShoot(e);
            e.shootTimer = e.shootRate + rnd(-200, 200);
        }

        // Out of bounds
        if (e.y > H + 60) {
            if (e.isBoss) { /* boss stays */ }
            else return false;
        }

        return true;
    });

    G.laserBeam = null;
}

function bossBehavior(e, dt) {
    e.phaseTimer = (e.phaseTimer||0) + dt;
    if (e.phaseTimer > e.phaseDur) {
        e.phase = (e.phase + 1) % e.phases.length;
        e.phaseTimer = 0;
        e.phaseDur = rnd(2,4);
    }

    const phase = e.phases[e.phase];

    if (phase === 'patrol') {
        if (!e.targetX || Math.abs(e.x - e.targetX) < 5) {
            e.targetX = rnd(80, W-80);
        }
        e.x += (e.targetX - e.x) * 2 * dt;
        e.y = lerp(e.y, 120, dt * 0.8);
    } else if (phase === 'charge') {
        e.x += (G.player.x - e.x) * dt * 1.5;
        e.y = lerp(e.y, 180, dt * 0.5);
    } else if (phase === 'retreat') {
        e.y = lerp(e.y, 80, dt * 0.5);
    }
}

function enemyShoot(e) {
    const ang = Math.atan2(G.player.y - e.y, G.player.x - e.x);
    const spd = e.bulletSpeed || 220;

    if (e.isBoss) {
        // Boss shoots spread
        for (let i = -2; i <= 2; i++) {
            const a = ang + i * 0.2;
            G.enemyBullets.push({
                x: e.x, y: e.y,
                vx: Math.cos(a)*spd,
                vy: Math.sin(a)*spd,
                color: e.bulletColor || '#f44',
                r: 5,
            });
        }
    } else {
        G.enemyBullets.push({
            x: e.x, y: e.y,
            vx: Math.cos(ang)*spd,
            vy: Math.sin(ang)*spd,
            color: e.bulletColor || '#f84',
            r: 4,
        });
    }
}

// ── WAVE SYSTEM ───────────────────────────────────────
function updateWave(dt) {
    if (G.bossAlive) {
        const boss = G.enemies.find(e => e.isBoss);
        if (!boss) {
            G.bossAlive = false;
            document.getElementById('bossBar').style.display = 'none';
            G.wave++;
            addScore(2000);
            G.bombs = Math.min(G.bombs + 1, 5);
            G.waveTimer = 0;
            G.waveSpawned = false;
            announceWave();
        } else {
            // Update boss bar
            document.getElementById('bossFill').style.width = (boss.hp / boss.maxHp * 100) + '%';
        }
        return;
    }

    if (!G.waveSpawned) {
        G.waveTimer += dt * 1000;
        if (G.waveTimer >= G.waveDelay) {
            spawnWave();
            G.waveSpawned = true;
        }
    } else {
        if (G.enemies.length === 0) {
            G.wave++;
            G.waveTimer = 0;
            G.waveSpawned = false;
            addScore(500 * G.wave);
            G.bombs = Math.min(G.bombs + 1, 5);
            G.waveDelay = 2500;
            announceWave();
        }
    }
}

function spawnWave() {
    const w = G.wave;

    // Every 5 waves: Boss
    if (w % 5 === 0) {
        spawnBoss(w);
        return;
    }

    const count = 4 + w * 2;
    const types = getEnemyTypes(w);

    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            if (!G.running) return;
            const T = types[rndInt(0, types.length-1)];
            spawnEnemy(T, w);
        }, i * 280);
    }
}

function getEnemyTypes(wave) {
    if (wave <= 2) return ['grunt'];
    if (wave <= 4) return ['grunt','grunt','scout'];
    if (wave <= 6) return ['grunt','scout','fighter'];
    if (wave <= 8) return ['scout','fighter','tank'];
    return ['fighter','tank','bomber','scout'];
}

function spawnEnemy(type, wave) {
    const x = rnd(30, W-30);
    const base = {
        x, y: rnd(-60,-20),
        originX: x,
        age: 0, hp: 1, maxHp: 1,
        score: 100,
        shootTimer: rnd(1000,3000),
        shootRate: null,
    };

    const defs = {
        grunt: {
            color:'#f44', size:14,
            pattern:'straight', speed:90+wave*8,
            dx: rnd(-40,40), hp:1, score:100,
            shootRate: null,
        },
        scout: {
            color:'#f84', size:12,
            pattern:'sine', speed:100+wave*6,
            sineFreq:2.5, sineAmp:60,
            hp:1, score:150,
            shootRate: 2800 - wave*100,
            bulletSpeed:200, bulletColor:'#f84',
        },
        fighter: {
            color:'#a4f', size:16,
            pattern:'zigzag', speed:80+wave*5,
            dx:120, hp:2+Math.floor(wave/3),
            score:200,
            shootRate:2200 - wave*80,
            bulletSpeed:230, bulletColor:'#d4f',
        },
        tank: {
            color:'#4af', size:22,
            pattern:'straight', speed:50+wave*4,
            dx:rnd(-20,20), hp:5+wave,
            score:350,
            shootRate:1800, bulletSpeed:180,
            bulletColor:'#4ff',
        },
        bomber: {
            color:'#ff4', size:18,
            pattern:'dive', speed:140+wave*5,
            dx:0, hp:2, score:280,
            shootRate:null,
        },
        orbiter: {
            color:'#f4a', size:11,
            pattern:'orbit',
            centerX:rnd(100,W-100), centerY:rnd(-100,-40),
            orbitR:rnd(40,70), orbitSpeed:rnd(-3,3)||2,
            angle:rnd(0,Math.PI*2),
            speed:0, dx:0,
            hp:1, score:180,
            shootRate:3000, bulletSpeed:190,
        },
    };

    const def = defs[type] || defs.grunt;
    const e = Object.assign({}, base, def);
    e.maxHp = e.hp;
    G.enemies.push(e);
}

function spawnBoss(wave) {
    const tier = Math.floor(wave / 5);
    const colors = ['#f44','#f4a','#a4f','#4af','#ff4','#f84'];
    const col = colors[tier % colors.length];

    const boss = {
        x: W/2, y: -80,
        size: 44,
        color: col,
        hp: 60 + tier * 40,
        maxHp: 60 + tier * 40,
        isBoss: true,
        pattern:'boss',
        age:0,
        phases: ['patrol','charge','patrol','retreat'],
        phase:0, phaseTimer:0, phaseDur:3,
        speed:120, dx:0,
        score: 3000 + tier * 1000,
        shootTimer:0, shootRate:900 - tier*60,
        bulletSpeed: 260 + tier*20,
        bulletColor: col,
    };
    G.enemies.push(boss);
    G.bossAlive = true;
    document.getElementById('bossBar').style.display = 'block';
    document.getElementById('bossFill').style.width = '100%';
}

// ── COLLISIONS ────────────────────────────────────────
function checkCollisions() {
    const p = G.player;

    // Player bullets vs enemies
    G.bullets.forEach(b => {
        if (b.dead) return;
        G.enemies.forEach(e => {
            if (dist(b, e) < b.r + e.size) {
                b.dead = true;
                b.life = 0;
                damageEnemy(e, 1);
                spawnParticles(b.x, b.y, b.color, 5, 0.25);
            }
        });
    });

    // Enemy bullets vs player
    if (G.invincible <= 0) {
        G.enemyBullets.forEach(b => {
            if (b.dead) return;
            if (dist(b, p) < b.r + 14) {
                b.dead = true;
                hitPlayer();
            }
        });
        G.enemyBullets = G.enemyBullets.filter(b => !b.dead);
    }

    // Enemies vs player (collision)
    if (G.invincible <= 0) {
        G.enemies.forEach(e => {
            if (dist(e, p) < e.size + 14) {
                hitPlayer();
                if (!e.isBoss) {
                    damageEnemy(e, 999);
                }
            }
        });
    }

    // Power-ups
    G.powerups = G.powerups.filter(pu => {
        if (dist(pu, p) < pu.r + 20) {
            applyPowerup(pu.type);
            spawnParticles(pu.x, pu.y, pu.color, 12, 0.5);
            return false;
        }
        return true;
    });
}

function damageEnemy(e, dmg) {
    e.hp -= dmg;
    e.hit = 6; // flash frames
    if (e.hp <= 0) {
        killEnemy(e);
    }
}

function killEnemy(e) {
    G.kills++;
    G.combo++;
    G.comboTimer = 2500;

    const multiplier = Math.min(G.combo, 8);
    addScore(e.score * multiplier);

    spawnExplosion(e.x, e.y, e.size, e.color);
    spawnPowerupMaybe(e.x, e.y);

    if (G.combo >= 3) {
        showCombo(G.combo, multiplier);
    }

    if (e.isBoss) {
        for (let i = 0; i < 5; i++) {
            setTimeout(() => spawnExplosion(
                e.x + rnd(-e.size,e.size),
                e.y + rnd(-e.size,e.size),
                e.size * 0.6, e.color
            ), i * 150);
        }
        addScore(1000);
    }
}

function hitPlayer() {
    G.invincible = 1800;

    if (G.shield > 0) {
        G.shield--;
        spawnParticles(G.player.x, G.player.y, '#0ff', 15, 0.5);
        G.shieldRegen = 0;
        return;
    }

    G.lives--;
    spawnParticles(G.player.x, G.player.y, '#f44', 25, 0.8);

    if (G.lives <= 0) {
        setTimeout(gameOver, 400);
    }
}

// ── POWER-UPS ─────────────────────────────────────────
function spawnPowerupMaybe(x, y) {
    if (Math.random() > 0.18) return;
    const types = [
        { type:'rapid',  color:'#0ff', label:'R' },
        { type:'triple', color:'#f0f', label:'3' },
        { type:'shield', color:'#ff0', label:'S' },
        { type:'laser',  color:'#0f0', label:'L' },
        { type:'bomb',   color:'#f80', label:'B' },
        { type:'life',   color:'#f44', label:'♥' },
    ];
    const t = types[rndInt(0, types.length-1)];
    G.powerups.push({ x, y, r:10, ...t, bob:0 });
}

function applyPowerup(type) {
    if (type === 'rapid')  { G.pu.rapid  = 8000; showNotif('RAPID FIRE!','#0ff'); }
    if (type === 'triple') { G.pu.triple = 7000; showNotif('TRIPLE SHOT!','#f0f'); }
    if (type === 'laser')  { G.pu.laser  = 5000; showNotif('LASER!','#0f0'); }
    if (type === 'shield') {
        G.shield = Math.min(G.shield + 3, G.maxShield);
        showNotif('SHIELD+','#ff0');
    }
    if (type === 'bomb') {
        G.bombs = Math.min(G.bombs + 1, 5);
        showNotif('BOMB+','#f80');
    }
    if (type === 'life') {
        G.lives = Math.min(G.lives + 1, 5);
        showNotif('LIFE+','#f44');
    }
    updateHUD();
}

// ── EXPLOSIONS & PARTICLES ────────────────────────────
function spawnExplosion(x, y, size, color) {
    const count = Math.floor(size * 1.8);
    for (let i = 0; i < count; i++) {
        const angle = rnd(0, Math.PI*2);
        const spd = rnd(40, 250);
        G.particles.push({
            x, y,
            vx: Math.cos(angle)*spd,
            vy: Math.sin(angle)*spd,
            color: Math.random() > 0.5 ? color : '#fff',
            r: rnd(1.5, size * 0.35),
            life: rnd(0.3, 0.9),
        });
    }
}

function spawnParticles(x, y, color, count, life) {
    for (let i = 0; i < count; i++) {
        const angle = rnd(0, Math.PI*2);
        G.particles.push({
            x, y,
            vx: Math.cos(angle)*rnd(30,180),
            vy: Math.sin(angle)*rnd(30,180),
            color, r: rnd(1,3),
            life: rnd(life*0.5, life),
        });
    }
}

// ── SCORE & COMBO ─────────────────────────────────────
function addScore(n) {
    G.score += n;
    document.getElementById('scoreDisp').textContent = G.score;
}

function showCombo(combo, mult) {
    const el = document.getElementById('comboDisplay');
    el.innerHTML = `${combo}x COMBO<br><span style="font-size:9px;color:#fa0">×${mult} MULTIPLIER</span>`;
    el.style.opacity = '1';
    el.style.color = combo >= 6 ? '#f0f' : '#ff0';
}

function hideCombo() {
    document.getElementById('comboDisplay').style.opacity = '0';
}

function announceWave() {
    const el = document.getElementById('waveAnnounce');
    const isBoss = G.wave % 5 === 0;
    el.innerHTML = isboss()
        ? `⚠ BOSS WAVE ${G.wave} ⚠`
        : `WAVE ${G.wave}`;
    el.style.color = isboss() ? '#f44' : '#0ff';
    el.style.textShadow = isoss() ? '0 0 20px #f44' : '0 0 20px #0ff';
    el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; }, 2000);
    function isoss() { return G.wave % 5 === 0; }
    function isoss2() { return isoss(); }
}

// Fix the announceWave function
function announceWave() {
    const el = document.getElementById('waveAnnounce');
    const isBossWave = G.wave % 5 === 0;
    el.innerHTML = isBossWave ? `⚠ BOSS WAVE ${G.wave} ⚠` : `WAVE ${G.wave}`;
    el.style.color = isBossWave ? '#f44' : '#0ff';
    el.style.textShadow = isBossWave ? '0 0 20px #f44' : '0 0 20px #0ff';
    el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; }, 2000);
}

let notifTimer = null;
function showNotif(msg, color) {
    const el = document.getElementById('waveAnnounce');
    el.innerHTML = msg;
    el.style.color = color;
    el.style.textShadow = `0 0 20px ${color}`;
    el.style.opacity = '1';
    clearTimeout(notifTimer);
    notifTimer = setTimeout(() => { el.style.opacity = '0'; }, 1200);
}

// ── HUD UPDATE ─────────────────────────────────────────
function updateHUD() {
    document.getElementById('scoreDisp').textContent = G.score;
    document.getElementById('waveDisp').textContent = G.wave;

    // Lives
    const ld = document.getElementById('livesDisplay');
    ld.innerHTML = '';
    for (let i = 0; i < 5; i++) {
        const d = document.createElement('div');
        d.className = 'life-icon' + (i < G.lives ? '' : ' empty');
        ld.appendChild(d);
    }

    // Shield
    const shArr = '■'.repeat(G.shield) + '□'.repeat(G.maxShield - G.shield);
    const sd = document.getElementById('shieldDisp');
    sd.textContent = shArr;
    sd.style.color = G.shield > 2 ? '#0ff' : G.shield > 0 ? '#ff0' : '#f44';
}

// ── RENDER ─────────────────────────────────────────────
function render() {
    // Background
    ctx.fillStyle = '#000008';
    ctx.fillRect(0, 0, W, H);

    // Nebula
    const ng = ctx.createRadialGradient(W*0.3,H*0.4,0, W*0.3,H*0.4,300);
    ng.addColorStop(0, 'rgba(30,0,60,0.3)');
    ng.addColorStop(1, 'transparent');
    ctx.fillStyle = ng;
    ctx.fillRect(0,0,W,H);

    const ng2 = ctx.createRadialGradient(W*0.7,H*0.7,0, W*0.7,H*0.7,250);
    ng2.addColorStop(0, 'rgba(0,20,50,0.3)');
    ng2.addColorStop(1, 'transparent');
    ctx.fillStyle = ng2;
    ctx.fillRect(0,0,W,H);

    // Stars
    G.stars.forEach(s => {
        ctx.globalAlpha = s.bright;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Laser beam
    if (G.laserBeam) {
        ctx.save();
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#0f0';
        ctx.shadowBlur = 20;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.moveTo(G.laserBeam.x, G.laserBeam.y);
        ctx.lineTo(G.laserBeam.x, 0);
        ctx.stroke();
        ctx.globalAlpha = 0.3;
        ctx.lineWidth = 12;
        ctx.stroke();
        ctx.restore();
    }

    // Particles
    G.particles.forEach(p => {
        const alpha = p.life > 0 ? p.life : 0;
        ctx.globalAlpha = Math.min(alpha, 1);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(p.r * alpha, 0.5), 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // Power-ups
    G.powerups.forEach(pu => {
        const bob = Math.sin(pu.bob) * 4;
        ctx.save();
        ctx.translate(pu.x, pu.y + bob);
        ctx.shadowColor = pu.color;
        ctx.shadowBlur = 16;

        // Outer ring
        ctx.strokeStyle = pu.color;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(0, 0, pu.r + 4, 0, Math.PI*2);
        ctx.stroke();

        // Core
        ctx.globalAlpha = 1;
        ctx.fillStyle = pu.color;
        ctx.beginPath();
        ctx.arc(0, 0, pu.r, 0, Math.PI*2);
        ctx.fill();

        // Label
        ctx.fillStyle = '#000';
        ctx.font = 'bold 10px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 0;
        ctx.fillText(pu.label, 0, 0);
        ctx.restore();
    });

    // Enemy bullets
    G.enemyBullets.forEach(b => {
        ctx.save();
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        ctx.fill();
        // trail
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(b.x - b.vx*0.02, b.y - b.vy*0.02, b.r*0.6, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    });

    // Player bullets
    G.bullets.forEach(b => {
        ctx.save();
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 14;
        ctx.fillStyle = b.color;

        if (G.pu.laser > 0) {
            ctx.fillRect(b.x - 2, b.y - 10, 4, 20);
        } else {
            ctx.beginPath();
            ctx.ellipse(b.x, b.y, b.r*0.4, b.r, 0, 0, Math.PI*2);
            ctx.fill();
        }

        // Glow core
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r*0.25, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    });

    // Enemies
    G.enemies.forEach(e => {
        const hitFlash = e.hit > 0;
        if (hitFlash) { e.hit--; }

        ctx.save();
        ctx.translate(e.x, e.y);

        ctx.shadowColor = hitFlash ? '#fff' : e.color;
        ctx.shadowBlur = hitFlash ? 30 : 16;

        if (e.isBoss) {
            drawBoss(e, hitFlash);
        } else {
            drawEnemy(e, hitFlash);
        }

        // HP bar (for enemies with > 1 maxHP)
        if (e.maxHp > 1) {
            const bw = e.size * 2.2;
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = '#300';
            ctx.fillRect(-bw/2, e.size + 4, bw, 4);
            ctx.fillStyle = e.hp/e.maxHp > 0.5 ? '#0f0' : e.hp/e.maxHp > 0.25 ? '#ff0' : '#f00';
            ctx.fillRect(-bw/2, e.size + 4, bw * (e.hp/e.maxHp), 4);
        }

        ctx.restore();
    });

    // Player
    drawPlayer();

    // Invincibility flash
    if (G.invincible > 0 && Math.floor(G.invincible / 100) % 2 === 0) {
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = '#0ff2';
        ctx.beginPath();
        ctx.arc(G.player.x, G.player.y, 24, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Scan line effect
    for (let y = 0; y < H; y += 4) {
        ctx.fillStyle = 'rgba(0,0,0,0.04)';
        ctx.fillRect(0, y, W, 1);
    }

    // Vignette
    const vg = ctx.createRadialGradient(W/2,H/2,W*0.35, W/2,H/2,W*0.7);
    vg.addColorStop(0,'transparent');
    vg.addColorStop(1,'rgba(0,0,0,0.5)');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);
}

function drawPlayer() {
    const p = G.player;
    const x = p.x, y = p.y;

    ctx.save();
    ctx.translate(x, y);

    // Engine glow
    const thrust = 10 + Math.sin(p.thrustAnim) * 4;
    const tg = ctx.createRadialGradient(0, 20, 0, 0, 20, thrust);
    tg.addColorStop(0, 'rgba(0,180,255,0.9)');
    tg.addColorStop(0.5, 'rgba(0,80,200,0.4)');
    tg.addColorStop(1, 'transparent');
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.arc(0, 20, thrust, 0, Math.PI*2);
    ctx.fill();

    // Ship body
    ctx.shadowColor = '#0cf';
    ctx.shadowBlur = 20;

    // Main hull
    ctx.fillStyle = '#0af';
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(-14, 10);
    ctx.lineTo(-6, 6);
    ctx.lineTo(0, 14);
    ctx.lineTo(6, 6);
    ctx.lineTo(14, 10);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#aff';
    ctx.beginPath();
    ctx.ellipse(0, -6, 5, 8, 0, 0, Math.PI*2);
    ctx.fill();

    // Wings detail
    ctx.fillStyle = '#07a';
    ctx.beginPath();
    ctx.moveTo(-14, 10);
    ctx.lineTo(-20, 16);
    ctx.lineTo(-8, 10);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(14, 10);
    ctx.lineTo(20, 16);
    ctx.lineTo(8, 10);
    ctx.closePath();
    ctx.fill();

    // Power-up glow ring
    if (G.pu.rapid > 0 || G.pu.triple > 0 || G.pu.laser > 0) {
        const pc = G.pu.laser > 0 ? '#0f0' : G.pu.triple > 0 ? '#f0f' : '#0ff';
        ctx.strokeStyle = pc;
        ctx.lineWidth = 2;
        ctx.shadowColor = pc;
        ctx.shadowBlur = 12;
        ctx.globalAlpha = 0.5 + Math.sin(Date.now()*0.008)*0.3;
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI*2);
        ctx.stroke();
    }

    ctx.restore();
}

function drawEnemy(e, hit) {
    const s = e.size;
    const col = hit ? '#fff' : e.color;
    ctx.fillStyle = col;

    switch(e.pattern) {
        case 'straight':
        case 'zigzag': {
            // Diamond
            ctx.beginPath();
            ctx.moveTo(0, -s);
            ctx.lineTo(s*0.7, 0);
            ctx.lineTo(0, s);
            ctx.lineTo(-s*0.7, 0);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = hit ? '#f44' : '#000';
            ctx.beginPath();
            ctx.arc(0, 0, s*0.3, 0, Math.PI*2);
            ctx.fill();
            break;
        }
        case 'sine': {
            // Arrow
            ctx.beginPath();
            ctx.moveTo(0, -s);
            ctx.lineTo(s, s*0.5);
            ctx.lineTo(s*0.4, s*0.2);
            ctx.lineTo(s*0.4, s);
            ctx.lineTo(-s*0.4, s);
            ctx.lineTo(-s*0.4, s*0.2);
            ctx.lineTo(-s, s*0.5);
            ctx.closePath();
            ctx.fill();
            break;
        }
        case 'dive':
        case 'orbit': {
            // Circle with cross
            ctx.beginPath();
            ctx.arc(0, 0, s, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = hit ? '#fff' : '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-s, 0); ctx.lineTo(s, 0);
            ctx.moveTo(0, -s); ctx.lineTo(0, s);
            ctx.stroke();
            break;
        }
        default: {
            ctx.beginPath();
            ctx.arc(0, 0, s, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

function drawBoss(e, hit) {
    const s = e.size;
    const t = Date.now() * 0.001;
    const col = hit ? '#fff' : e.color;

    ctx.fillStyle = col;

    // Main body
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(s*1.3, -s*0.3);
    ctx.lineTo(s*0.8, s*0.6);
    ctx.lineTo(s*0.3, s);
    ctx.lineTo(-s*0.3, s);
    ctx.lineTo(-s*0.8, s*0.6);
    ctx.lineTo(-s*1.3, -s*0.3);
    ctx.closePath();
    ctx.fill();

    // Inner core
    ctx.fillStyle = hit ? '#f44' : '#000';
    ctx.beginPath();
    ctx.arc(0, 0, s*0.4, 0, Math.PI*2);
    ctx.fill();

    // Pulsing eye
    const pulse = 0.5 + Math.sin(t*4)*0.3;
    ctx.fillStyle = e.color;
    ctx.shadowBlur = 24;
    ctx.globalAlpha = pulse;
    ctx.beginPath();
    ctx.arc(0, 0, s*0.25, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Rotating ring
    ctx.save();
    ctx.rotate(t * 2);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.setLineDash([8,8]);
    ctx.beginPath();
    ctx.arc(0, 0, s*1.1, 0, Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Wing cannons
    const wingPos = [{x:-s*1.1,y:0},{x:s*1.1,y:0}];
    wingPos.forEach(wp => {
        ctx.fillStyle = col;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(wp.x, wp.y, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#f44';
        ctx.beginPath();
        ctx.arc(wp.x, wp.y, 4, 0, Math.PI*2);
        ctx.fill();
    });
}
