<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
  <title>Cyber Tic-Tac-Toe Deluxe — Realistic Neon Duel</title>
  
  <!-- PeerJS for Real-time Peer-to-Peer Online Multiplayer -->
  <script src="peerjs.min.js"></script>
  <script>
    if (typeof Peer === 'undefined') {
      document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');
    }
  </script>

  <style>
    :root {
      --bg-dark: #07090e;
      --bg-surface: #0e1320;
      --bg-card: #141b2d;
      --neon-cyan: #00e5ff;
      --neon-cyan-glow: rgba(0, 229, 255, 0.45);
      --neon-pink: #ff007f;
      --neon-pink-glow: rgba(255, 0, 127, 0.45);
      --neon-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --board-border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .game-wrapper {
      width: 100%;
      max-width: 520px;
      background: var(--bg-surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 50px rgba(0, 229, 255, 0.08);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 12px;
    }

    .header-title-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .game-title {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .game-subtitle {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    /* Mode & Settings Bar */
    .mode-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 12px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .segmented-control {
      display: flex;
      background: var(--bg-card);
      padding: 3px;
      border-radius: 8px;
      gap: 4px;
    }

    .seg-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .seg-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
    }
    .seg-btn.active.cyan {
      background: var(--neon-cyan);
      color: #000;
    }

    /* Scoreboard */
    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .score-card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      position: relative;
      transition: all 0.3s;
    }

    .score-card.active-turn {
      border-color: currentColor;
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.25);
      transform: translateY(-2px);
    }

    .score-card.player-x { color: var(--neon-cyan); }
    .score-card.player-o { color: var(--neon-pink); }
    .score-card.draws { color: var(--text-muted); }

    .score-label {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .score-num {
      font-size: 1.4rem;
      font-weight: 900;
      line-height: 1;
    }

    /* Turn Indicator Banner */
    .turn-banner {
      text-align: center;
      font-size: 0.9rem;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .turn-banner .turn-symbol {
      font-size: 1.1rem;
    }

    /* Game Board Grid */
    .board-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 440px;
      margin: 0 auto;
      background: #060911;
      border: 4px solid #1a2236;
      border-radius: 20px;
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.9), 0 10px 30px rgba(0, 0, 0, 0.6);
      padding: 8px;
    }

    .ttt-grid {
      display: grid;
      width: 100%;
      height: 100%;
      gap: 8px;
    }

    .ttt-grid.grid-3 {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
    }

    .ttt-grid.grid-4 {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
    }

    .ttt-cell {
      background: #0d121f;
      border: 2px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.6);
    }

    .ttt-cell:hover:not(.taken) {
      background: #151d30;
      border-color: rgba(255, 255, 255, 0.15);
      transform: scale(1.02);
    }

    .ttt-cell.winning-cell {
      animation: pulseWin 1s infinite alternate;
    }

    @keyframes pulseWin {
      from { transform: scale(0.96); filter: brightness(1.2); }
      to { transform: scale(1.03); filter: brightness(1.6); }
    }

    /* Realistic Neon Symbols (SVG or CSS vector) */
    .symbol-svg {
      width: 68%;
      height: 68%;
      animation: popSymbol 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    @keyframes popSymbol {
      from { transform: scale(0.2); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Laser Strike Line Overlay */
    .laser-line-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Bottom Actions */
    .bottom-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-action {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--neon-cyan);
    }

    .btn-action.primary {
      background: linear-gradient(135deg, #059669, #10b981);
      border: none;
      color: #fff;
    }

    .btn-action.primary:hover {
      filter: brightness(1.1);
      transform: scale(1.02);
    }

    /* Online Multiplayer Lobby & Match CSS */
    .online-panel {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.08), rgba(255, 0, 127, 0.08));
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .online-action-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-online-action {
      background: var(--bg-card);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      text-align: left;
      width: 100%;
    }

    .btn-online-action:hover {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.25);
      transform: translateY(-2px);
    }

    .btn-online-action.primary {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(0, 180, 216, 0.3));
      border-color: var(--neon-cyan);
    }

    .action-icon {
      font-size: 24px;
    }

    .action-text {
      display: flex;
      flex-direction: column;
    }

    .action-title {
      font-size: 0.92rem;
      color: #fff;
    }

    .action-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .join-box {
      display: flex;
      gap: 8px;
    }

    .join-box input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      outline: none;
    }

    .join-box input:focus {
      border-color: var(--neon-pink);
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
    }

    .join-box .btn-online-action {
      padding: 8px 18px;
      font-weight: 800;
      font-size: 0.85rem;
      width: auto;
      justify-content: center;
    }

    /* Room Lobby Card */
    .room-lobby-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lobby-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .room-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .room-badge-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 800;
    }

    .room-code-display {
      font-family: monospace;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      background: rgba(0, 0, 0, 0.5);
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid rgba(0, 229, 255, 0.4);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
    }

    .connection-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .connection-status-pill.waiting {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.3);
    }

    .connection-status-pill.connected {
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.4);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      box-shadow: 0 0 8px #fbbf24;
      animation: pulseAnim 1.2s infinite;
      display: inline-block;
    }

    .pulse-dot.active {
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
    }

    @keyframes pulseAnim {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .invite-link-row {
      display: flex;
      gap: 6px;
    }

    .invite-link-row input {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.75rem;
      color: #e2e8f0;
      font-family: monospace;
      outline: none;
    }

    .btn-copy-link, .btn-share-link {
      background: var(--bg-card);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: var(--neon-cyan);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-share-link {
      background: linear-gradient(135deg, rgba(37, 211, 102, 0.2), rgba(18, 140, 126, 0.3));
      border-color: #25d366;
      color: #25d366;
    }

    .btn-copy-link:hover, .btn-share-link:hover {
      filter: brightness(1.2);
      transform: translateY(-1px);
    }

    .lobby-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .lobby-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .btn-leave-room {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-leave-room:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
    }

    .btn-leave-room.compact {
      padding: 5px 12px;
      font-size: 0.76rem;
    }

    /* Active Match Bar */
    .active-match-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      border-radius: 10px;
    }

    .match-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .role-badge {
      font-size: 0.78rem;
      font-weight: 800;
    }

    /* Reactions */
    .reaction-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding-top: 4px;
    }

    .reaction-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-right: 4px;
    }

    .btn-reaction {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 4px 8px;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .btn-reaction:hover {
      transform: scale(1.3);
      background: rgba(0, 229, 255, 0.2);
      border-color: var(--neon-cyan);
    }

    /* Floating Reaction Particle */
    .floating-reaction {
      position: absolute;
      font-size: 38px;
      pointer-events: none;
      z-index: 100;
      animation: floatUpBurst 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.8));
    }

    @keyframes floatUpBurst {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.3); }
      20% { opacity: 1; transform: translate(-50%, -20px) scale(1.2); }
      70% { opacity: 0.9; transform: translate(-50%, -80px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -130px) scale(0.8); }
    }

    /* In-game Toast Notification */
    .online-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 229, 255, 0.3);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
      animation: toastIn 0.25s ease;
      white-space: nowrap;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @media (max-width: 480px) {
      .game-wrapper {
        padding: 14px;
      }
      .game-title {
        font-size: 1.15rem;
      }
      .score-num {
        font-size: 1.2rem;
      }
      .room-code-display {
        font-size: 1.05rem;
        letter-spacing: 1px;
      }
      .invite-link-row {
        flex-direction: column;
      }
      .btn-copy-link, .btn-share-link {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <!-- Header -->
    <div class="header">
      <div class="header-title-box">
        <span style="font-size: 26px;">⚡</span>
        <div>
          <h1 class="game-title">CYBER TIC-TAC-TOE</h1>
          <p class="game-subtitle">Holographic Neon Duel • Minimax AI & 2-Player</p>
        </div>
      </div>
    </div>

    <!-- Mode & Options Panel -->
    <div class="mode-bar">
      <!-- Player Mode -->
      <div class="control-row">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">Opponent:</span>
        <div class="segmented-control" id="opponentControl">
          <button class="seg-btn active cyan" data-mode="ai">🤖 vs Smart AI</button>
          <button class="seg-btn" data-mode="pvp">👥 Local 2P</button>
          <button class="seg-btn" data-mode="online">🌐 Online Duel</button>
        </div>
      </div>

      <!-- AI Difficulty (shown when vs AI is active) -->
      <div class="control-row" id="aiDiffRow">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">AI Skill:</span>
        <div class="segmented-control" id="diffControl">
          <button class="seg-btn" data-diff="easy">Novice</button>
          <button class="seg-btn" data-diff="medium">Tactician</button>
          <button class="seg-btn active cyan" data-diff="hard">Grandmaster 🏆</button>
        </div>
      </div>

      <!-- Grid Size -->
      <div class="control-row">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">Board Size:</span>
        <div class="segmented-control" id="gridSizeControl">
          <button class="seg-btn active cyan" data-grid="3">3×3 (Classic)</button>
          <button class="seg-btn" data-grid="4">4×4 (Tactical 4)</button>
        </div>
      </div>
    </div>

    <!-- Online Multiplayer Lobby & Match Panel -->
    <div class="online-panel" id="onlinePanel" style="display: none;">
      <!-- 1. Lobby: Choice to Create or Join -->
      <div id="onlineChoiceView">
        <div class="online-action-grid">
          <button type="button" class="btn-online-action primary" id="btnCreateRoom" onclick="hostCreateRoom()">
            <span class="action-icon">⚡</span>
            <div class="action-text">
              <strong class="action-title">Create Room & Invite Friend</strong>
              <span class="action-sub">Generate invite link to send via WhatsApp, Messenger, etc.</span>
            </div>
          </button>

          <div class="join-box">
            <input type="text" id="joinCodeInput" placeholder="Room Code (e.g. CYBER-8421)" maxlength="15" autocomplete="off" spellcheck="false">
            <button type="button" class="btn-online-action" id="btnJoinRoom" onclick="guestJoinRoom()">
              <span>🔑 Join</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 2. Host Waiting View -->
      <div id="onlineHostView" style="display: none;">
        <div class="room-lobby-card">
          <div class="lobby-header">
            <div class="room-badge">
              <span class="room-badge-label">ROOM:</span>
              <span class="room-code-display" id="roomCodeDisplay">CYBER-0000</span>
            </div>
            <div class="connection-status-pill waiting" id="hostConnStatus">
              <span class="pulse-dot"></span>
              <span id="hostConnText">Waiting for friend to join...</span>
            </div>
          </div>

          <div class="invite-link-row">
            <input type="text" id="inviteLinkInput" readonly value="">
            <button type="button" class="btn-copy-link" id="btnCopyInvite" onclick="copyInviteLink()">
              <span>📋 Copy Link</span>
            </button>
            <button type="button" class="btn-share-link" id="btnShareInvite" onclick="shareInviteLink()">
              <span>📲 Share</span>
            </button>
          </div>

          <div class="lobby-footer">
            <span class="lobby-hint">💡 Send this link to your friend! Game starts when they open it.</span>
            <button type="button" class="btn-leave-room" onclick="leaveOnlineGame()">✕ Cancel</button>
          </div>
        </div>
      </div>

      <!-- 3. Active Connected Match Status & Reactions -->
      <div id="onlineMatchView" style="display: none;">
        <div class="active-match-card">
          <div class="match-meta">
            <div class="connection-status-pill connected" id="activeConnStatus">
              <span class="pulse-dot active"></span>
              <span id="activeConnText">Live Match</span>
            </div>
            <div class="role-badge" id="myRoleBadge">
              <span>You: <strong id="myRoleText" style="color: var(--neon-cyan);">Player X</strong></span>
            </div>
          </div>
          <button type="button" class="btn-leave-room compact" onclick="leaveOnlineGame()" title="Leave match">
            <span>🚪 Exit</span>
          </button>
        </div>

        <!-- Quick Emoji Reaction Bar -->
        <div class="reaction-bar" id="reactionBar">
          <span class="reaction-label">React:</span>
          <button type="button" class="btn-reaction" onclick="sendReaction('🔥')" title="Fire">🔥</button>
          <button type="button" class="btn-reaction" onclick="sendReaction('⚡')" title="Lightning">⚡</button>
          <button type="button" class="btn-reaction" onclick="sendReaction('😂')" title="Laugh">😂</button>
          <button type="button" class="btn-reaction" onclick="sendReaction('👏')" title="Applause">👏</button>
          <button type="button" class="btn-reaction" onclick="sendReaction('💀')" title="Dead">💀</button>
          <button type="button" class="btn-reaction" onclick="sendReaction('🎯')" title="Bullseye">🎯</button>
        </div>
      </div>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-card player-x active-turn" id="cardX">
        <div class="score-label"><span>✕</span> Player X</div>
        <div class="score-num" id="scoreX">0</div>
      </div>
      <div class="score-card draws" id="cardDraws">
        <div class="score-label"><span>⚖️</span> Draws</div>
        <div class="score-num" id="scoreDraws">0</div>
      </div>
      <div class="score-card player-o" id="cardO">
        <div class="score-label"><span id="oLabel">◯ Player O</span></div>
        <div class="score-num" id="scoreO">0</div>
      </div>
    </div>

    <!-- Turn Banner -->
    <div class="turn-banner" id="turnBanner">
      <span class="turn-symbol" style="color: var(--neon-cyan);">✕</span>
      <span id="turnText">Player X's Turn</span>
    </div>

    <!-- Board Arena -->
    <div class="board-container">
      <div class="ttt-grid grid-3" id="boardGrid">
        <!-- Cells generated by JS -->
      </div>
      <canvas class="laser-line-canvas" id="laserCanvas"></canvas>
    </div>

    <!-- Bottom Actions -->
    <div class="bottom-actions">
      <button class="btn-action primary" id="btnRestart" onclick="onRestartClicked()">
        <span>🔄</span> <span>Next Round</span>
      </button>
      <button class="btn-action" id="btnResetScore" onclick="onResetScoreClicked()">
        <span>🗑️</span> <span>Reset Scores</span>
      </button>
    </div>
  </div>

  <script>
    // --- AUDIO SYNTHESIS VIA WEB AUDIO API ---
    let audioCtx = null;
    function playChirp(freq, type = 'sine', duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundX() { playChirp(440, 'triangle', 0.1); }
    function soundO() { playChirp(660, 'sine', 0.12); }
    function soundWin() {
      [523, 659, 784, 1046].forEach((f, i) => {
        setTimeout(() => playChirp(f, 'square', 0.18), i * 110);
      });
    }
    function soundDraw() {
      playChirp(300, 'sawtooth', 0.25);
    }

    // --- GAME STATE ---
    let opponent = 'ai'; // 'ai', 'pvp', or 'online'
    let aiDifficulty = 'hard'; // 'easy', 'medium', 'hard' (Minimax)
    let gridSize = 3; // 3 or 4
    let winStreakReq = 3; // 3 in a row for 3x3, 4 for 4x4
    let board = [];
    let currentPlayer = 'X';
    let isGameOver = false;
    let scores = { X: 0, O: 0, Draws: 0 };
    let winningCombo = null;

    // --- ONLINE MULTIPLAYER STATE ---
    let myOnlineRole = null; // 'X' (Host) or 'O' (Guest)
    let isOnlineConnected = false;
    let activeConn = null;
    let hostPeer = null;
    let guestPeer = null;
    let currentRoomCode = null;

    // --- DOM REFS ---
    const boardGrid = document.getElementById('boardGrid');
    const laserCanvas = document.getElementById('laserCanvas');
    const laserCtx = laserCanvas.getContext('2d');
    const turnBanner = document.getElementById('turnBanner');
    const cardX = document.getElementById('cardX');
    const cardO = document.getElementById('cardO');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const scoreDrawsEl = document.getElementById('scoreDraws');
    const oLabel = document.getElementById('oLabel');
    const aiDiffRow = document.getElementById('aiDiffRow');

    const onlinePanel = document.getElementById('onlinePanel');
    const onlineChoiceView = document.getElementById('onlineChoiceView');
    const onlineHostView = document.getElementById('onlineHostView');
    const onlineMatchView = document.getElementById('onlineMatchView');
    const roomCodeDisplay = document.getElementById('roomCodeDisplay');
    const hostConnStatus = document.getElementById('hostConnStatus');
    const hostConnText = document.getElementById('hostConnText');
    const inviteLinkInput = document.getElementById('inviteLinkInput');
    const btnCopyInvite = document.getElementById('btnCopyInvite');
    const joinCodeInput = document.getElementById('joinCodeInput');
    const myRoleText = document.getElementById('myRoleText');

    function init() {
      setupControls();
      restartRound();

      // Check if URL has ?room=...
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        document.querySelectorAll('#opponentControl .seg-btn').forEach(b => {
          const isOnline = b.dataset.mode === 'online';
          b.classList.toggle('active', isOnline);
          b.classList.toggle('cyan', isOnline);
        });
        selectOpponentMode('online');
        setTimeout(() => {
          guestJoinRoom(roomParam);
        }, 350);
      }
    }

    function restartRound() {
      const totalCells = gridSize * gridSize;
      board = Array(totalCells).fill(null);
      currentPlayer = 'X';
      isGameOver = false;
      winningCombo = null;
      clearLaser();

      updateTurnBanner();
      renderBoard();
    }

    function onRestartClicked() {
      restartRound();
      if (opponent === 'online' && activeConn && activeConn.open) {
        activeConn.send({ type: 'restart' });
      }
    }

    function resetAllScores() {
      scores = { X: 0, O: 0, Draws: 0 };
      scoreXEl.innerText = '0';
      scoreOEl.innerText = '0';
      scoreDrawsEl.innerText = '0';
      restartRound();
    }

    function onResetScoreClicked() {
      resetAllScores();
      if (opponent === 'online' && activeConn && activeConn.open) {
        activeConn.send({ type: 'reset_scores' });
      }
    }

    function renderBoard() {
      boardGrid.className = `ttt-grid grid-${gridSize}`;
      boardGrid.innerHTML = '';

      board.forEach((val, idx) => {
        const cell = document.createElement('div');
        cell.className = `ttt-cell ${val ? 'taken' : ''}`;
        cell.dataset.index = idx;

        if (winningCombo && winningCombo.includes(idx)) {
          cell.classList.add('winning-cell');
        }

        if (val === 'X') {
          cell.innerHTML = `
            <svg class="symbol-svg" viewBox="0 0 100 100">
              <defs>
                <filter id="glowX" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00e5ff" flood-opacity="0.9"/>
                </filter>
              </defs>
              <line x1="22" y1="22" x2="78" y2="78" stroke="#00e5ff" stroke-width="12" stroke-linecap="round" filter="url(#glowX)"/>
              <line x1="78" y1="22" x2="22" y2="78" stroke="#00e5ff" stroke-width="12" stroke-linecap="round" filter="url(#glowX)"/>
              <line x1="22" y1="22" x2="78" y2="78" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
              <line x1="78" y1="22" x2="22" y2="78" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
            </svg>
          `;
        } else if (val === 'O') {
          cell.innerHTML = `
            <svg class="symbol-svg" viewBox="0 0 100 100">
              <defs>
                <filter id="glowO" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff007f" flood-opacity="0.9"/>
                </filter>
              </defs>
              <circle cx="50" cy="50" r="30" fill="none" stroke="#ff007f" stroke-width="12" stroke-linecap="round" filter="url(#glowO)"/>
              <circle cx="50" cy="50" r="30" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
            </svg>
          `;
        }

        cell.addEventListener('click', () => handleCellClick(idx));
        boardGrid.appendChild(cell);
      });
    }

    function handleCellClick(idx) {
      if (isGameOver || board[idx] !== null) return;
      if (opponent === 'ai' && currentPlayer === 'O') return;

      if (opponent === 'online') {
        if (!activeConn || !isOnlineConnected) {
          showToast("⚠️ Waiting for friend to join...");
          return;
        }
        if (currentPlayer !== myOnlineRole) {
          showToast(`⏳ It's Player ${currentPlayer}'s turn! Please wait.`);
          soundDraw();
          return;
        }
        makeMove(idx, myOnlineRole);
        if (activeConn && activeConn.open) {
          activeConn.send({ type: 'move', idx, symbol: myOnlineRole });
        }
        return;
      }

      makeMove(idx, currentPlayer);

      if (!isGameOver && opponent === 'ai' && currentPlayer === 'O') {
        setTimeout(triggerAIMove, 340);
      }
    }

    function makeMove(idx, player) {
      board[idx] = player;
      if (player === 'X') soundX();
      else soundO();

      renderBoard();

      const winResult = checkWin(board, gridSize, winStreakReq);
      if (winResult) {
        handleWin(winResult);
        return;
      }

      if (board.every(cell => cell !== null)) {
        handleDraw();
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateTurnBanner();
    }

    function updateTurnBanner() {
      cardX.classList.toggle('active-turn', currentPlayer === 'X' && !isGameOver);
      cardO.classList.toggle('active-turn', currentPlayer === 'O' && !isGameOver);

      if (isGameOver) return;

      if (opponent === 'online') {
        const isMyTurn = (currentPlayer === myOnlineRole);
        if (isMyTurn) {
          turnBanner.innerHTML = `
            <span class="turn-symbol" style="color: ${myOnlineRole === 'X' ? 'var(--neon-cyan)' : 'var(--neon-pink)'};">${myOnlineRole === 'X' ? '✕' : '◯'}</span>
            <span style="color: #38bdf8; font-weight: 800;">⚡ YOUR TURN! Place your mark</span>
          `;
        } else {
          const oppSymbol = myOnlineRole === 'X' ? '◯' : '✕';
          turnBanner.innerHTML = `
            <span class="turn-symbol" style="color: ${oppSymbol === 'X' ? 'var(--neon-cyan)' : 'var(--neon-pink)'};">${oppSymbol}</span>
            <span style="color: var(--text-muted);">Opponent is thinking...</span>
          `;
        }
        return;
      }

      if (currentPlayer === 'X') {
        turnBanner.innerHTML = `
          <span class="turn-symbol" style="color: var(--neon-cyan);">✕</span>
          <span>${opponent === 'ai' ? 'Your Turn (X)' : "Player X's Turn"}</span>
        `;
      } else {
        turnBanner.innerHTML = `
          <span class="turn-symbol" style="color: var(--neon-pink);">◯</span>
          <span>${opponent === 'ai' ? 'AI is Thinking...' : "Player O's Turn"}</span>
        `;
      }
    }

    // --- WIN DETECTION ---
    function checkWin(currBoard, size, reqStreak) {
      const combos = generateWinCombos(size, reqStreak);
      for (const combo of combos) {
        const first = currBoard[combo[0]];
        if (first && combo.every(idx => currBoard[idx] === first)) {
          return { winner: first, combo: combo };
        }
      }
      return null;
    }

    function generateWinCombos(size, req) {
      const combos = [];
      // Horizontal
      for (let r = 0; r < size; r++) {
        for (let c = 0; c <= size - req; c++) {
          const combo = [];
          for (let k = 0; k < req; k++) combo.push(r * size + (c + k));
          combos.push(combo);
        }
      }
      // Vertical
      for (let c = 0; c < size; c++) {
        for (let r = 0; r <= size - req; r++) {
          const combo = [];
          for (let k = 0; k < req; k++) combo.push((r + k) * size + c);
          combos.push(combo);
        }
      }
      // Diagonal Down-Right
      for (let r = 0; r <= size - req; r++) {
        for (let c = 0; c <= size - req; c++) {
          const combo = [];
          for (let k = 0; k < req; k++) combo.push((r + k) * size + (c + k));
          combos.push(combo);
        }
      }
      // Diagonal Up-Right
      for (let r = req - 1; r < size; r++) {
        for (let c = 0; c <= size - req; c++) {
          const combo = [];
          for (let k = 0; k < req; k++) combo.push((r - k) * size + (c + k));
          combos.push(combo);
        }
      }
      return combos;
    }

    function handleWin(result) {
      isGameOver = true;
      winningCombo = result.combo;
      scores[result.winner]++;
      scoreXEl.innerText = scores.X;
      scoreOEl.innerText = scores.O;

      soundWin();
      renderBoard();
      drawLaserStrike(result.combo);

      const winColor = result.winner === 'X' ? 'var(--neon-cyan)' : 'var(--neon-pink)';
      const winName = result.winner === 'X' 
        ? (opponent === 'ai' ? 'YOU WON!' : 'PLAYER X WON!') 
        : (opponent === 'ai' ? 'AI WON!' : 'PLAYER O WON!');

      turnBanner.innerHTML = `
        <span style="font-size: 1.2rem; color: ${winColor};">🏆 ${winName}</span>
      `;
    }

    function handleDraw() {
      isGameOver = true;
      scores.Draws++;
      scoreDrawsEl.innerText = scores.Draws;
      soundDraw();

      turnBanner.innerHTML = `
        <span style="font-size: 1.1rem; color: var(--text-muted);">⚖️ STALEMATE DRAW!</span>
      `;
    }

    // --- LASER STRIKE LINE EFFECT ---
    function drawLaserStrike(combo) {
      laserCanvas.width = boardGrid.clientWidth;
      laserCanvas.height = boardGrid.clientHeight;

      const cells = boardGrid.querySelectorAll('.ttt-cell');
      const startCell = cells[combo[0]];
      const endCell = cells[combo[combo.length - 1]];

      if (!startCell || !endCell) return;

      const r1 = startCell.getBoundingClientRect();
      const r2 = endCell.getBoundingClientRect();
      const parentRect = boardGrid.getBoundingClientRect();

      const x1 = r1.left + r1.width / 2 - parentRect.left;
      const y1 = r1.top + r1.height / 2 - parentRect.top;
      const x2 = r2.left + r2.width / 2 - parentRect.left;
      const y2 = r2.top + r2.height / 2 - parentRect.top;

      const isX = board[combo[0]] === 'X';
      const glowColor = isX ? '#00e5ff' : '#ff007f';

      laserCtx.save();
      laserCtx.strokeStyle = glowColor;
      laserCtx.lineWidth = 8;
      laserCtx.lineCap = 'round';
      laserCtx.shadowColor = glowColor;
      laserCtx.shadowBlur = 18;

      laserCtx.beginPath();
      laserCtx.moveTo(x1, y1);
      laserCtx.lineTo(x2, y2);
      laserCtx.stroke();

      laserCtx.strokeStyle = '#ffffff';
      laserCtx.lineWidth = 3;
      laserCtx.stroke();
      laserCtx.restore();
    }

    function clearLaser() {
      laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);
    }

    // --- AI STRATEGY & MINIMAX ALGORITHM ---
    function triggerAIMove() {
      if (isGameOver) return;
      const bestIdx = getBestAIMove();
      if (bestIdx !== null) {
        makeMove(bestIdx, 'O');
      }
    }

    function getBestAIMove() {
      const available = [];
      board.forEach((val, i) => { if (val === null) available.push(i); });
      if (available.length === 0) return null;

      // 1. Easy / Novice: Random moves
      if (aiDifficulty === 'easy') {
        return available[Math.floor(Math.random() * available.length)];
      }

      // 2. Medium / Tactician: Win if possible, block opponent if needed
      if (aiDifficulty === 'medium') {
        // Can AI win immediately?
        for (const idx of available) {
          board[idx] = 'O';
          if (checkWin(board, gridSize, winStreakReq)) { board[idx] = null; return idx; }
          board[idx] = null;
        }
        // Can Player win immediately? Block it!
        for (const idx of available) {
          board[idx] = 'X';
          if (checkWin(board, gridSize, winStreakReq)) { board[idx] = null; return idx; }
          board[idx] = null;
        }
        // Prefer Center in 3x3
        if (gridSize === 3 && board[4] === null) return 4;
        return available[Math.floor(Math.random() * available.length)];
      }

      // 3. Hard / Grandmaster: Minimax with Alpha-Beta Pruning (Optimal Unbeatable AI)
      if (aiDifficulty === 'hard') {
        if (gridSize === 3) {
          // Classic 3x3 Minimax
          let bestScore = -Infinity;
          let move = available[0];

          for (const idx of available) {
            board[idx] = 'O';
            let score = minimax(board, 0, false, -Infinity, Infinity, 8);
            board[idx] = null;
            if (score > bestScore) {
              bestScore = score;
              move = idx;
            }
          }
          return move;
        } else {
          // 4x4 Grid Depth-limited Alpha-Beta heuristic
          let bestScore = -Infinity;
          let move = available[0];

          for (const idx of available) {
            board[idx] = 'O';
            let score = minimax4x4(board, 0, false, -Infinity, Infinity, 3);
            board[idx] = null;
            if (score > bestScore) {
              bestScore = score;
              move = idx;
            }
          }
          return move;
        }
      }

      return available[0];
    }

    function minimax(currBoard, depth, isMaximizing, alpha, beta, maxDepth) {
      const win = checkWin(currBoard, 3, 3);
      if (win) return win.winner === 'O' ? (10 - depth) : (depth - 10);
      if (currBoard.every(c => c !== null) || depth >= maxDepth) return 0;

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (currBoard[i] === null) {
            currBoard[i] = 'O';
            let evalScore = minimax(currBoard, depth + 1, false, alpha, beta, maxDepth);
            currBoard[i] = null;
            maxEval = Math.max(maxEval, evalScore);
            alpha = Math.max(alpha, evalScore);
            if (beta <= alpha) break;
          }
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let i = 0; i < 9; i++) {
          if (currBoard[i] === null) {
            currBoard[i] = 'X';
            let evalScore = minimax(currBoard, depth + 1, true, alpha, beta, maxDepth);
            currBoard[i] = null;
            minEval = Math.min(minEval, evalScore);
            beta = Math.min(beta, evalScore);
            if (beta <= alpha) break;
          }
        }
        return minEval;
      }
    }

    function minimax4x4(currBoard, depth, isMaximizing, alpha, beta, maxDepth) {
      const win = checkWin(currBoard, 4, 4);
      if (win) return win.winner === 'O' ? (100 - depth) : (depth - 100);
      if (currBoard.every(c => c !== null) || depth >= maxDepth) return 0;

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let i = 0; i < 16; i++) {
          if (currBoard[i] === null) {
            currBoard[i] = 'O';
            let evalScore = minimax4x4(currBoard, depth + 1, false, alpha, beta, maxDepth);
            currBoard[i] = null;
            maxEval = Math.max(maxEval, evalScore);
            alpha = Math.max(alpha, evalScore);
            if (beta <= alpha) break;
          }
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let i = 0; i < 16; i++) {
          if (currBoard[i] === null) {
            currBoard[i] = 'X';
            let evalScore = minimax4x4(currBoard, depth + 1, true, alpha, beta, maxDepth);
            currBoard[i] = null;
            minEval = Math.min(minEval, evalScore);
            beta = Math.min(beta, evalScore);
            if (beta <= alpha) break;
          }
        }
        return minEval;
      }
    }

    // --- ONLINE MULTIPLAYER CONTROLLER ---
    function selectOpponentMode(mode) {
      opponent = mode;
      if (mode === 'online') {
        aiDiffRow.style.display = 'none';
        onlinePanel.style.display = 'flex';
        cardX.querySelector('.score-label').innerHTML = '<span>✕</span> Player X';
        cardO.querySelector('.score-label').innerHTML = '<span>◯</span> Player O';
      } else if (mode === 'ai') {
        leaveOnlineGame(true);
        aiDiffRow.style.display = 'flex';
        onlinePanel.style.display = 'none';
        oLabel.innerText = '🤖 AI Bot';
        cardX.querySelector('.score-label').innerHTML = '<span>✕</span> Player X';
        cardO.querySelector('.score-label').innerHTML = '<span id="oLabel">🤖 AI Bot</span>';
        restartRound();
      } else {
        leaveOnlineGame(true);
        aiDiffRow.style.display = 'none';
        onlinePanel.style.display = 'none';
        oLabel.innerText = '◯ Player O';
        cardX.querySelector('.score-label').innerHTML = '<span>✕</span> Player X';
        cardO.querySelector('.score-label').innerHTML = '<span id="oLabel">◯ Player O</span>';
        restartRound();
      }
    }

    function hostCreateRoom() {
      if (typeof Peer === 'undefined') {
        showToast("⚠️ PeerJS loading... Please retry in a moment.");
        return;
      }
      leaveOnlineGame(true);

      const code = 'CYBER-' + Math.floor(1000 + Math.random() * 9000);
      currentRoomCode = code;
      const peerId = 'gh-ttt-' + code.toLowerCase();

      roomCodeDisplay.innerText = code;
      const inviteUrl = window.location.protocol + '//' + window.location.host + window.location.pathname + '?room=' + code;
      inviteLinkInput.value = inviteUrl;

      onlineChoiceView.style.display = 'none';
      onlineHostView.style.display = 'block';
      onlineMatchView.style.display = 'none';

      hostConnStatus.className = 'connection-status-pill waiting';
      hostConnText.innerText = 'Initializing room...';

      try {
        hostPeer = new Peer(peerId, {
          debug: 1,
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:global.stun.twilio.com:3478' }
            ]
          }
        });

        hostPeer.on('open', (id) => {
          hostConnText.innerText = 'Waiting for friend to join...';
          showToast(`⚡ Room ${code} is ready! Share the link.`);
        });

        hostPeer.on('connection', (conn) => {
          activeConn = conn;
          myOnlineRole = 'X';
          bindConnectionEvents(conn);
        });

        hostPeer.on('error', (err) => {
          console.error("Host error:", err);
          if (err.type === 'unavailable-id') {
            hostCreateRoom();
          } else {
            showToast("Network note: " + (err.type || err.message));
          }
        });
      } catch (err) {
        console.error(err);
        showToast("⚠️ Error starting online room.");
      }
    }

    function guestJoinRoom(providedCode) {
      if (typeof Peer === 'undefined') {
        showToast("⚠️ PeerJS loading... Please retry in a moment.");
        return;
      }

      let code = providedCode || joinCodeInput.value.trim();
      if (!code) {
        showToast("⚠️ Please enter a room code!");
        return;
      }
      code = code.toUpperCase();
      if (!code.startsWith('CYBER-')) {
        code = 'CYBER-' + code;
      }
      currentRoomCode = code;
      leaveOnlineGame(true);

      onlineChoiceView.style.display = 'none';
      onlineHostView.style.display = 'block';
      onlineMatchView.style.display = 'none';

      roomCodeDisplay.innerText = code;
      inviteLinkInput.value = window.location.protocol + '//' + window.location.host + window.location.pathname + '?room=' + code;

      hostConnStatus.className = 'connection-status-pill waiting';
      hostConnText.innerText = `Connecting to room ${code}...`;

      try {
        guestPeer = new Peer({
          debug: 1,
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:global.stun.twilio.com:3478' }
            ]
          }
        });

        guestPeer.on('open', () => {
          const targetPeerId = 'gh-ttt-' + code.toLowerCase();
          const conn = guestPeer.connect(targetPeerId, { reliable: true });
          activeConn = conn;
          myOnlineRole = 'O';
          bindConnectionEvents(conn);
        });

        guestPeer.on('error', (err) => {
          console.error("Guest error:", err);
          showToast("⚠️ Connection issue: " + (err.type || err.message));
          hostConnText.innerText = 'Connection failed. Check code.';
        });
      } catch (err) {
        console.error(err);
        showToast("⚠️ Error connecting to room.");
      }
    }

    function bindConnectionEvents(conn) {
      conn.on('open', () => {
        isOnlineConnected = true;
        onlineHostView.style.display = 'none';
        onlineChoiceView.style.display = 'none';
        onlineMatchView.style.display = 'block';

        if (myOnlineRole === 'X') {
          myRoleText.innerText = "Player X (✕ - Host)";
          myRoleText.style.color = "var(--neon-cyan)";
          cardX.querySelector('.score-label').innerHTML = '<span>✕</span> You (Host)';
          cardO.querySelector('.score-label').innerHTML = '<span>◯</span> Friend (Guest)';
          conn.send({
            type: 'init_sync',
            gridSize: gridSize,
            scores: scores
          });
          showToast("🎉 Friend joined! You are Player X. Game Start!");
        } else {
          myRoleText.innerText = "Player O (◯ - Guest)";
          myRoleText.style.color = "var(--neon-pink)";
          cardX.querySelector('.score-label').innerHTML = '<span>✕</span> Friend (Host)';
          cardO.querySelector('.score-label').innerHTML = '<span>◯</span> You (Guest)';
          showToast(`🎉 Connected to ${currentRoomCode}! You are Player O.`);
        }

        restartRound();
        soundWin();
      });

      conn.on('data', (data) => {
        handleNetworkMessage(data);
      });

      conn.on('close', () => {
        handlePeerDisconnect();
      });

      conn.on('error', (err) => {
        console.error("Connection error:", err);
        handlePeerDisconnect();
      });
    }

    function handleNetworkMessage(data) {
      if (!data || !data.type) return;

      if (data.type === 'move') {
        if (board[data.idx] === null && !isGameOver) {
          makeMove(data.idx, data.symbol);
        }
      } else if (data.type === 'restart') {
        restartRound();
        showToast("🔄 Opponent started next round!");
      } else if (data.type === 'reset_scores') {
        scores = { X: 0, O: 0, Draws: 0 };
        scoreXEl.innerText = '0';
        scoreOEl.innerText = '0';
        scoreDrawsEl.innerText = '0';
        restartRound();
        showToast("🗑️ Scores reset by opponent!");
      } else if (data.type === 'reaction') {
        showFloatingReaction(data.emoji);
        playChirp(800, 'sine', 0.1);
      } else if (data.type === 'init_sync') {
        if (data.gridSize && data.gridSize !== gridSize) {
          gridSize = data.gridSize;
          winStreakReq = gridSize === 3 ? 3 : 4;
          document.querySelectorAll('#gridSizeControl .seg-btn').forEach(b => {
            const matches = parseInt(b.dataset.grid) === gridSize;
            b.classList.toggle('active', matches);
            b.classList.toggle('cyan', matches);
          });
        }
        if (data.scores) {
          scores = data.scores;
          scoreXEl.innerText = scores.X;
          scoreOEl.innerText = scores.O;
          scoreDrawsEl.innerText = scores.Draws;
        }
        restartRound();
      }
    }

    function handlePeerDisconnect() {
      isOnlineConnected = false;
      showToast("⚠️ Opponent disconnected.");
      soundDraw();
      const statusText = document.getElementById('activeConnText');
      if (statusText) statusText.innerText = 'Opponent Left';
      const statusPill = document.getElementById('activeConnStatus');
      if (statusPill) statusPill.className = 'connection-status-pill waiting';
    }

    function copyInviteLink() {
      const url = inviteLinkInput.value;
      if (!url) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
          showCopySuccess();
        }).catch(() => {
          fallbackCopy();
        });
      } else {
        fallbackCopy();
      }
    }

    function fallbackCopy() {
      inviteLinkInput.select();
      inviteLinkInput.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        showCopySuccess();
      } catch (e) {
        showToast("Link: " + inviteLinkInput.value);
      }
    }

    function showCopySuccess() {
      btnCopyInvite.innerHTML = '<span>✅ Copied!</span>';
      showToast("📋 Invitation link copied to clipboard!");
      setTimeout(() => {
        btnCopyInvite.innerHTML = '<span>📋 Copy Link</span>';
      }, 2200);
    }

    function shareInviteLink() {
      const url = inviteLinkInput.value;
      const shareData = {
        title: 'Cyber Tic-Tac-Toe Duel',
        text: `Play Cyber Tic-Tac-Toe with me online! Join room ${currentRoomCode}:`,
        url: url
      };

      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else {
        const waText = encodeURIComponent(`Play Cyber Tic-Tac-Toe with me online! Join room ${currentRoomCode}: ${url}`);
        window.open(`https://api.whatsapp.com/send?text=${waText}`, '_blank');
      }
    }

    function sendReaction(emoji) {
      showFloatingReaction(emoji);
      playChirp(700, 'sine', 0.08);
      if (opponent === 'online' && activeConn && activeConn.open) {
        activeConn.send({ type: 'reaction', emoji });
      }
    }

    function showFloatingReaction(emoji) {
      const container = document.querySelector('.board-container');
      if (!container) return;
      const el = document.createElement('div');
      el.className = 'floating-reaction';
      el.innerText = emoji;
      el.style.left = (30 + Math.random() * 40) + '%';
      el.style.top = (40 + Math.random() * 20) + '%';
      container.appendChild(el);
      setTimeout(() => el.remove(), 1600);
    }

    function leaveOnlineGame(silent = false) {
      if (activeConn) {
        try { activeConn.close(); } catch(e){}
        activeConn = null;
      }
      if (hostPeer) {
        try { hostPeer.destroy(); } catch(e){}
        hostPeer = null;
      }
      if (guestPeer) {
        try { guestPeer.destroy(); } catch(e){}
        guestPeer = null;
      }
      isOnlineConnected = false;
      currentRoomCode = null;
      myOnlineRole = null;

      onlineChoiceView.style.display = 'block';
      onlineHostView.style.display = 'none';
      onlineMatchView.style.display = 'none';

      cardX.querySelector('.score-label').innerHTML = '<span>✕</span> Player X';
      cardO.querySelector('.score-label').innerHTML = '<span id="oLabel">◯ Player O</span>';

      if (window.history.replaceState) {
        const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
      }

      if (!silent) {
        showToast("Left online game.");
        restartRound();
      }
    }

    function showToast(msg) {
      const existing = document.querySelector('.online-toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'online-toast';
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2600);
    }

    // --- CONTROLS SETUP ---
    function setupControls() {
      // Opponent mode
      document.querySelectorAll('#opponentControl .seg-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#opponentControl .seg-btn').forEach(b => b.classList.remove('active', 'cyan'));
          btn.classList.add('active', 'cyan');
          selectOpponentMode(btn.dataset.mode);
        });
      });

      // AI Difficulty
      document.querySelectorAll('#diffControl .seg-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#diffControl .seg-btn').forEach(b => b.classList.remove('active', 'cyan'));
          btn.classList.add('active', 'cyan');
          aiDifficulty = btn.dataset.diff;
          restartRound();
        });
      });

      // Grid Size
      document.querySelectorAll('#gridSizeControl .seg-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#gridSizeControl .seg-btn').forEach(b => b.classList.remove('active', 'cyan'));
          btn.classList.add('active', 'cyan');
          gridSize = parseInt(btn.dataset.grid);
          winStreakReq = gridSize === 3 ? 3 : 4;
          if (opponent === 'online' && activeConn && activeConn.open && myOnlineRole === 'X') {
            activeConn.send({ type: 'init_sync', gridSize, scores });
          }
          restartRound();
        });
      });

      window.addEventListener('resize', () => {
        if (winningCombo) drawLaserStrike(winningCombo);
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
